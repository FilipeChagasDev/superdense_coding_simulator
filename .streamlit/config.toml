[theme]
primaryColor = "#FF6B35"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "auto"

[logger]
level = "info"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
