[theme]
primaryColor = "#3564ff"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#f1f1f1"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "auto"

[logger]
level = "info"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
